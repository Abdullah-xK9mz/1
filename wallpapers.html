<!doctype html>

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خلفيات الموبايل 📱</title>
    <style>
      /* التنسيق الأساسي والانتقالات الانسيابية */
      body { 
        margin: 0; 
        padding: 20px; 
        color: #ffffff; 
        text-align: center; 
        font-family: sans-serif; 
        transition: background 0.5s ease, color 0.5s ease;
        position: relative;
        overflow-x: hidden;
        min-height: 100vh;
        box-sizing: border-box;
      }
      
      /* وضع النهار: خلفية انسيابية متحركة وألوان مريحة */
      body.light-mode {
        background: linear-gradient(-45deg, #e0f2fe, #f3e8ff, #bae6fd, #fafafa);
        background-size: 400% 400%;
        animation: gradientMovement 15s ease infinite;
        color: #1e293b;
      }
      @keyframes gradientMovement {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      body.light-mode h3 { background: #cbd5e1; color: #1e293b; }

      /* وضع الليل: أسود فخم */
      body.dark-mode { background: #000000; color: #ffffff; }
      body.dark-mode h3 { background: #1e293b; color: #ffffff; }

      /* لوحة النجوم للوضع الليلي فقط */
      #stars-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
        display: none;
      }
      body.dark-mode #stars-canvas { display: block; }

      /* شريط الترويسة العلوي لتنسيق العنوان مع زر العودة */
      .header-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 1200px;
        margin: 0 auto 20px auto;
        padding: 0 10px;
      }

      .header-container h1 { 
        color: #38bdf8; 
        margin: 0; 
        font-size: 1.8rem;
      }

      /* تنسيق زر الروابط العلوي */
      .back-btn { 
        color: #38bdf8; 
        text-decoration: none; 
        font-weight: bold; 
        padding: 8px 16px;
        border: 1px solid #38bdf8;
        border-radius: 8px;
        transition: 0.3s ease;
        background: rgba(56, 189, 248, 0.05);
      }
      .back-btn:hover { 
        background: #38bdf8; 
        color: #000000; 
      }

      h3 { padding: 12px; margin-top: 35px; border-radius: 5px; text-align: right; padding-right: 20px; transition: 0.3s; font-size: 1.2rem; }
      
      .theme-btn {
        background: #38bdf8; color: #fff; border: none; padding: 8px 16px; border-radius: 20px;
        font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
      .theme-btn:hover { background: #0284c7; transform: scale(1.05); }

      /* شبكة المعرض المتجاوبة للموبايل */
      .gallery { 
        display: grid; 
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
        gap: 12px; 
        padding: 15px 0;
      } 
      
      /* تنسيق الصور المصغرة في المعرض */
      .gallery img { 
        width: 100%; 
        border-radius: 10px; 
        border: 1px solid #333; 
        box-shadow: 0 4px 10px rgba(255,255,255,0.05);
        transition: 0.3s ease;
        cursor: pointer;
        aspect-ratio: 9 / 16;
        background: #111;
        object-fit: cover;
      }
      .gallery img:hover {
        transform: scale(1.05);
        border-color: #38bdf8;
      }

      /* تنسيق شاشة المعاينة الفخمة (Lightbox) المخصصة للموبايل */
      #lightbox {
        display: none; 
        position: fixed; 
        z-index: 9999; 
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 100%; 
        background: rgba(0,0,0,0.92); 
        align-items: center; 
        justify-content: center; 
        cursor: zoom-out;
        padding: 10px;
        box-sizing: border-box;
      }
      #lightbox-img {
        max-width: 90%; 
        max-height: 85vh; 
        border-radius: 12px; 
        box-shadow: 0 0 25px rgba(56,189,248,0.4);
        cursor: context-menu;
        transition: 0.2s;
        object-fit: contain;
      }

      /* 📱 التنسيق التكيفي لشاشات الموبايل الصغيرة */
      @media (max-width: 600px) {
        body { padding: 10px; }
        
        .header-container {
          flex-direction: column;
          gap: 12px;
          text-align: center;
        }

        .header-container h1 { font-size: 1.5rem; }
        h3 { font-size: 1rem; padding: 10px; }
        
        .gallery { 
          grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); 
          gap: 8px; 
        }
      }
    </style>

    <script>
      // 1. نظام تبديل الثيم (ليلي / نهاري) مع حفظ الاختيار
      function toggleTheme() {
        const body = document.body;
        if (body.classList.contains('dark-mode')) {
          body.classList.remove('dark-mode');
          body.classList.add('light-mode');
          localStorage.setItem('theme', 'light');
        } else {
          body.classList.remove('light-mode');
          body.classList.add('dark-mode');
          localStorage.setItem('theme', 'dark');
        }
      }

      if (localStorage.getItem('theme') === 'light') {
        document.body.classList.remove('dark-mode');
        document.body.classList.add('light-mode');
      }

      // 2. نظام تشغيل المعاينة التكبير (Lightbox) عند الضغط على أي صورة
      document.addEventListener('click', function(e) {
        if (e.target.tagName === 'IMG' && e.target.closest('.gallery')) {
          document.getElementById('lightbox-img').src = e.target.src;
          document.getElementById('lightbox').style.display = 'flex';
        }
      });

      // يغلق شاشة المعاينة فورًا بمجرد الضغط في أي مكان فاضي خارج الصورة الكبيرة
      document.getElementById('lightbox').addEventListener('click', function(e) {
        if (e.target !== document.getElementById('lightbox-img')) {
          this.style.display = 'none';
        }
      });

      // منع غلق المعاينة عند الضغط الطويل أو كليك يمين على الصورة الكبيرة للحفظ
      document.getElementById('lightbox-img').addEventListener('click', function(e) {
        e.stopPropagation();
      });

      // 3. نظام النجوم المتساقطة الـ Canvas للوضع الليلي
      const canvas = document.getElementById('stars-canvas');
      const ctx = canvas.getContext('2d');
      let stars = [];

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      for (let i = 0; i < 50; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          length: Math.random() * 15 + 5,
          speed: Math.random() * 4 + 2,
          opacity: Math.random() * 0.5 + 0.2
        });
      }

      function drawStars() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (document.body.classList.contains('dark-mode')) {
          for (let i = 0; i < stars.length; i++) {
            let s = stars[i];
            ctx.beginPath();
            ctx.moveTo(s.x, s.y);
            ctx.lineTo(s.x, s.y + s.length);
            ctx.strokeStyle = `rgba(56, 189, 248, ${s.opacity})`;
            ctx.lineWidth = 1;
            ctx.stroke();

            s.y += s.speed;
            if (s.y > canvas.height) {
              s.y = -s.length;
              s.x = Math.random() * canvas.width;
            }
          }
        }
        requestAnimationFrame(drawStars);
      }
      drawStars();
    </script>
