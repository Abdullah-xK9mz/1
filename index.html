<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Gift 🎁</title>
    <style>
      :root {
        --bg-color: #0b0f19;
        --card-bg: #131d31;
        --card-hover: #1b2845;
        --border-glow: rgba(0, 198, 255, 0.25);
        --border-hover: #00c6ff;
        --accent: #00c6ff;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --gold: #facc15;
        --whatsapp-green: #25d366;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body { 
        background: var(--bg-color);
        background-image: 
          radial-gradient(circle at 10% 20%, rgba(0, 198, 255, 0.05) 0%, transparent 40%),
          radial-gradient(circle at 90% 80%, rgba(0, 132, 255, 0.05) 0%, transparent 40%);
        color: var(--text-main); 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center; 
        min-height: 100vh; 
        padding: 15px;
      }

      /* الهيدر المدمج */
      .header-container {
        text-align: center;
        margin-bottom: 25px;
      }

      h1 { 
        font-size: 1.8rem; 
        color: var(--text-main); 
        margin-bottom: 5px;
        font-weight: 800;
      }

      h1 span {
        color: var(--accent);
        text-shadow: 0 0 15px rgba(0, 198, 255, 0.3);
      }

      .sub-title {
        font-size: 0.95rem;
        color: var(--text-muted);
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.03);
        padding: 4px 12px;
        border-radius: 50px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      /* شبكة المربعات (4 للكمبيوتر، 2 للموبايل محاذية ومنظمة) */
      .menu-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        width: 100%;
        max-width: 900px;
        margin-bottom: 15px;
      }

      .menu-card {
        background: var(--card-bg);
        border: 1px solid var(--border-glow);
        border-radius: 14px;
        padding: 18px 12px;
        text-decoration: none;
        color: var(--text-main);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        position: relative;
        overflow: hidden;
        transition: all 0.25s ease;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      }

      .menu-card:hover {
        background: var(--card-hover);
        border-color: var(--border-hover);
        transform: translateY(-4px);
        box-shadow: 0 10px 25px rgba(0, 198, 255, 0.15);
      }

      .card-img, .card-icon-reel { 
        width: 48px; 
        height: 48px; 
        object-fit: cover;
        border-radius: 12px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .card-text {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .card-title {
        font-size: 0.95rem;
        font-weight: 700;
        color: #fff;
      }

      .card-sub {
        font-size: 0.72rem;
        color: var(--text-muted);
      }

      /* مستطيل الدعم والتواصل بنفس استايل كروتك */
      .contact-card {
        grid-column: span 4;
        background: var(--card-bg);
        border: 1px solid var(--border-glow);
        border-radius: 14px;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        text-align: right;
      }

      .contact-info h3 {
        font-size: 0.95rem;
        font-weight: 700;
        color: #fff;
        margin-bottom: 4px;
      }

      .contact-info p {
        font-size: 0.78rem;
        color: var(--text-muted);
        line-height: 1.4;
      }

      .whatsapp-btn {
        background: #25d366;
        color: #fff;
        text-decoration: none;
        padding: 8px 16px;
        border-radius: 10px;
        font-size: 0.85rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
        transition: all 0.25s ease;
      }

      .whatsapp-btn:hover {
        background: #1da851;
        transform: translateY(-2px);
      }

      /* شريط البركة المدمج */
      .blessing-card {
        width: 100%;
        max-width: 900px;
        background: var(--card-bg);
        border: 1px solid var(--border-glow);
        border-radius: 12px;
        padding: 10px;
        text-align: center;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      }

      .daily-quote {
        font-size: 0.95rem;
        color: var(--text-main);
        font-weight: 600;
      }

      .sparkle {
        color: var(--gold);
        margin: 0 6px;
      }

      /* التجاوب للموبايل: صفين من المربعات 2x2 والمستطيل بعرض المربعين */
      @media (max-width: 768px) {
        .menu-container {
          grid-template-columns: repeat(2, 1fr);
          gap: 10px;
        }
        .menu-card {
          padding: 14px 10px;
        }
        .contact-card {
          grid-column: span 2;
          flex-direction: column;
          text-align: center;
          gap: 12px;
          padding: 16px 12px;
        }
        .whatsapp-btn {
          width: 100%;
          justify-content: center;
        }
        .card-img, .card-icon-reel {
          width: 40px;
          height: 40px;
          font-size: 22px;
          margin-bottom: 8px;
        }
        .card-title {
          font-size: 0.88rem;
        }
        .card-sub {
          font-size: 0.68rem;
        }
        h1 { font-size: 1.5rem; }
      }
    </style>
  </head>
  <body>

    <!-- الهيدر -->
    <div class="header-container">
      <h1><span>Dark Gift</span></h1>
      <div class="sub-title">
        <span>الموقع تحت التطوير</span>
        <span id="device-emoji">💻</span>
      </div>
    </div>

    <!-- الكروت الرئيسية -->
    <div class="menu-container">
        <!-- كارت خلفيات رائعة -->
        <a href="wallpapers.html" class="menu-card" id="wallpapers-btn">
            <img src="https://i.postimg.cc/4y8CT3dF/wallpapers.png" alt="Wallpaper" class="card-img">
            <div class="card-text">
                <span class="card-title">خلفيات</span>
                <span class="card-sub">🖼️ استعراض</span>
            </div>
        </a>

        <!-- كارت مكتبة الألعاب -->
        <a href="games.html" class="menu-card" id="games-btn">
            <div class="card-icon-reel">🎮</div>
            <div class="card-text">
                <span class="card-title">الألعاب</span>
                <span class="card-sub">🕹️ تصفح</span>
            </div>
        </a>

        <!-- كارت مركز الأدوات -->
        <a href="Tools.html" class="menu-card" id="tools-btn">
            <div class="card-icon-reel">🛠️</div>
            <div class="card-text">
                <span class="card-title">الأدوات</span>
                <span class="card-sub">🧰 الورشة</span>
            </div>
        </a>

        <!-- كارت تحميل تيك توك -->
        <a href="Tik_Downloader.html" class="menu-card" id="tiktok-btn">
            <div class="card-icon-reel">🎵</div>
            <div class="card-text">
                <span class="card-title">تنزيل تيك توك</span>
                <span class="card-sub">⚡ بدون علامة</span>
            </div>
        </a>

        <!-- كارت الدعم والتواصل (مستطيل يأخذ عرض المربعين على الموبايل وعرض الـ 4 كروت على الشاشة الكبيرة) -->
        <div class="contact-card">
            <div class="contact-info">
                <h3>لو عندك مشكلة أو أفكار جديدة؟ 🛠️</h3>
                <p>إذا واجهتك أي مشكلة أو حابب تقترح إضافات جديدة للموقع، تواصل معنا مباشرة</p>
            </div>
            <a href="https://wa.me/201098029320" target="_blank" class="whatsapp-btn">
                💬 تواصل عبر واتساب
            </a>
        </div>
    </div>

    <!-- كارت النصيحة والصلاة على النبي -->
    <div class="blessing-card">
      <p id="daily-quote" class="daily-quote">
        <span class="sparkle">✨</span> صَلِّ على النبي <span class="sparkle">✨</span>
      </p> 
    </div>

    <script>
      function initAdaptiveRouting() {
        const userAgent = navigator.userAgent.toLowerCase();
        const emoji = document.getElementById('device-emoji');

        if (/iphone|ipad|ipod/.test(userAgent)) {
          emoji.innerText = "🍏"; 
        } else if (/android/.test(userAgent)) {
          emoji.innerText = "🤖"; 
        } else {
          emoji.innerText = "💻"; 
        }
      }

      window.onload = initAdaptiveRouting;
    </script>
  </body>
</html>
